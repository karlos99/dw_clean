<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dramatic Flowing Network - More Visible Lines</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fcfbf9; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    // --- Configuration ---
    const PARTICLE_COUNT = 450; 
    const CONNECTION_DISTANCE = 110; 
    const WAVE_SPEED = 0.002;
    const WAVE_HEIGHT = 50; 
    
    // Aesthetic Colors
    const COLORS = [0x3498db, 0xe67e22, 0x1abc9c];
    const BG_COLOR = 0xfaf9f5;

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);
    scene.fog = new THREE.FogExp2(BG_COLOR, 0.0015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 500;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Particle System ---
    const particles = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const initialPositions = []; 
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);

    const particleData = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const x = Math.random() * 1000 - 500;
        const y = Math.random() * 1000 - 500;
        const z = Math.random() * 1000 - 500;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        initialPositions.push({ x, y, z });

        const color = new THREE.Color(COLORS[Math.floor(Math.random() * COLORS.length)]);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;

        sizes[i] = Math.random() * 6; 

        particleData.push({
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 0.5
        });
    }

    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const pMaterial = new THREE.PointsMaterial({
        vertexColors: true,
        size: 5, 
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.8
    });

    const pointCloud = new THREE.Points(particles, pMaterial);
    scene.add(pointCloud);

    // --- Lines (UPDATED FOR VISIBILITY) ---
    const lineGeometry = new THREE.BufferGeometry();
    const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x333333, // Darker gray for better contrast
        transparent: true,
        opacity: 0.3, // Increased opacity (was 0.12)
        // blending: THREE.MultiplyBlending // Removed multiply blending for a more solid look
    });

    const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(linesMesh);

    // --- Interaction ---
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX - windowHalfX) * 0.5;
        mouseY = (event.clientY - windowHalfY) * 0.5;
    });

    // --- Animation Loop ---
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += WAVE_SPEED;

        // 1. WAVE ANIMATION
        const positionsAttribute = particles.attributes.position;
        const currentPositions = positionsAttribute.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const initial = initialPositions[i];
            const data = particleData[i];
            
            // "Flow" movement
            const waveY = Math.sin(time * 5 + initial.x * 0.005 + data.phase) * WAVE_HEIGHT;
            const waveX = Math.cos(time * 3 + initial.z * 0.005) * 20;

            currentPositions[i * 3] = initial.x + waveX;     // X
            currentPositions[i * 3 + 1] = initial.y + waveY; // Y
            currentPositions[i * 3 + 2] = initial.z;         // Z
        }
        positionsAttribute.needsUpdate = true;

        // 2. LINE CONNECTIONS
        const linePositions = [];
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            for (let j = i + 1; j < PARTICLE_COUNT; j++) {
                
                const dx = currentPositions[i * 3] - currentPositions[j * 3];
                const dy = currentPositions[i * 3 + 1] - currentPositions[j * 3 + 1];
                const dz = currentPositions[i * 3 + 2] - currentPositions[j * 3 + 2];
                const distSq = dx * dx + dy * dy + dz * dz;

                if (distSq < CONNECTION_DISTANCE * CONNECTION_DISTANCE) {
                    linePositions.push(
                        currentPositions[i * 3], currentPositions[i * 3 + 1], currentPositions[i * 3 + 2],
                        currentPositions[j * 3], currentPositions[j * 3 + 1], currentPositions[j * 3 + 2]
                    );
                }
            }
        }

        linesMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

        // 3. DRAMATIC CAMERA MOVEMENT
        targetX = mouseX * 0.001;
        targetY = mouseY * 0.001;

        pointCloud.rotation.y += 0.002;
        linesMesh.rotation.y += 0.002;
        
        pointCloud.rotation.x += (targetY - pointCloud.rotation.x) * 0.05;
        linesMesh.rotation.x += (targetY - linesMesh.rotation.x) * 0.05;

        camera.position.z = 500 + Math.sin(time * 2) * 50;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
