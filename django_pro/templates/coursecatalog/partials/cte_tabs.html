    <a href="{% url 'coursecatalog:cte_taxonomy' %}?tab=tagging"
       class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors {% if cte_tab == 'tagging' %}bg-white text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}">Tagging</a>
    <a href="{% url 'coursecatalog:cte_taxonomy' %}?tab=paths"
