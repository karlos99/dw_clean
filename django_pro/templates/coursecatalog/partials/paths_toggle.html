{# Segmented toggle: Custom paths ↔ CTE paths. Expects `active` = 'custom' | 'cte'. #}
<div class="mb-5 inline-flex rounded-lg border border-slate-200 bg-slate-50 p-0.5">
    <a href="{% url 'coursecatalog:paths' %}"
       class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors {% if active == 'custom' %}bg-white text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}">Custom paths</a>
    <a href="{% url 'coursecatalog:cte_taxonomy' %}?tab=paths"
       class="px-3 py-1.5 rounded-md text-xs font-semibold transition-colors {% if active == 'cte' %}bg-white text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}">CTE paths</a>
</div>
