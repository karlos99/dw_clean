{% for period, col_key in periods.items %}
<label class="flex items-center space-x-2 p-1.5 hover:bg-slate-50 rounded cursor-pointer transition-colors">
    <input type="checkbox" data-column="{{ col_key }}"
        class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 h-4 w-4">
    <span class="text-sm {% if period|lower == 'live' %}font-bold text-slate-900{% else %}text-slate-700{% endif %}">{{ period }}</span>
</label>
{% endfor %}
