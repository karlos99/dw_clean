<div id="create-folder-modal" class="fixed inset-0 z-[60] overflow-y-auto" aria-labelledby="modal-title" role="dialog"
    aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity" aria-hidden="true"
            onclick="document.getElementById('modals-container').innerHTML=''"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <form id="create-folder-form" hx-post="{% url 'dataexploration:create_folder' %}" 
                hx-target="#modals-container" 
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful) { document.getElementById('modals-container').innerHTML=''; showMessage('Folder created successfully', 'success'); htmx.ajax('GET', '{% url 'dataexploration:folder_browser' %}', {target: '#folder-browser', swap: 'innerHTML'}); }">
                {% csrf_token %}
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Create New Folder</h3>
                    <div class="mt-4 space-y-4">
                        <div>
                            <label for="location_select" class="block text-sm font-medium text-gray-700">Location</label>
                            <select id="location_select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md" onchange="updateLocation()">
                                <optgroup label="Top Level">
                                    <option value="TYPE:USER">My Folder (Root)</option>
                                    <option value="TYPE:SCHOOL">School Folder (Root)</option>
                                    <option value="TYPE:DISTRICT">District Folder (Root)</option>
                                </optgroup>
                                <optgroup label="Existing Folders">
                                    {% for folder in folder_options %}
                                    <option value="FOLDER:{{ folder.id }}" data-indent="{{ folder.indent }}" {% if folder.id|stringformat:"s" == parent_id %}selected{% endif %}>
                                        {{ folder.name }}
                                    </option>
                                    {% endfor %}
                                </optgroup>
                            </select>
                            <input type="hidden" name="parent_id" id="hidden_parent_id">
                            <input type="hidden" name="folder_type" id="hidden_folder_type" value="USER">
                        </div>

                        <div>
                            <label for="folder_name" class="block text-sm font-medium text-gray-700">Folder Name</label>
                            <input type="text" name="name" id="folder_name" required
                                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>

                        <div>
                            <label for="folder_description"
                                class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea name="description" id="folder_description" rows="2"
                                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="submit"
                        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Create Folder
                    </button>
                    <button type="button" onclick="document.getElementById('modals-container').innerHTML=''"
                        class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
