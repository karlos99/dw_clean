<div class="relative" data-schedule-filter="{{ filter_key }}">
    <span class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">{{ label }}</span>
    <button type="button" data-schedule-ms-btn
        class="w-full flex items-center gap-2 px-3 py-2 text-sm border border-slate-300 rounded bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-left disabled:bg-slate-100 disabled:text-slate-400 disabled:pointer-events-none">
        <span data-schedule-ms-label class="truncate flex-1 text-slate-400">{{ placeholder }}</span>
        <span class="text-slate-400 text-xs flex-shrink-0" aria-hidden="true">▾</span>
    </button>
    <div data-schedule-ms-panel
        class="hidden absolute z-40 mt-1 w-full min-w-[14rem] bg-white border border-slate-200 rounded-md shadow-lg max-h-52 overflow-y-auto p-2 space-y-0.5">
    </div>
</div>
