{% load static %}
{% if error %}
<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3">{{ error }}</div>
{% else %}
{# When used standalone (chart builder), add min-height so ECharts has room. #}
{# When injected into an existing container (dashboard/page), the outer element provides height. #}
<div class="chart-container w-full h-full min-h-[300px]"
     data-chart-option="{{ option_json|default:'{}' }}"
     data-chart-id="{{ chart_id }}"
     data-drill-enabled="{{ drill_enabled|default:'0' }}"
     data-drill-source="{{ drill_source|default:'' }}"
     data-drill-source-id="{{ drill_source_id|default:'' }}"
     data-drill-source-name="{{ drill_source_name|default:'' }}"
     data-series-names="{{ series_names_json|default:'[]' }}">
</div>
{% endif %}
