{% load static %}
{% if error %}
<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3">{{ error }}</div>
{% else %}
{# In embed context (page/dashboard) the outer slot provides height via flex. #}
{# In standalone context (chart builder preview), enforce a min-height so ECharts has room. #}
<div class="chart-container w-full{% if not embed %} min-h-[460px]{% endif %}"
     data-chart-option="{{ option_json|default:'{}' }}"
     data-chart-id="{{ chart_id }}"
     data-drill-enabled="{{ drill_enabled|default:'0' }}"
     data-drill-source="{{ drill_source|default:'' }}"
     data-drill-source-id="{{ drill_source_id|default:'' }}"
     data-drill-source-name="{{ drill_source_name|default:'' }}"
     data-series-names="{{ series_names_json|default:'[]' }}"
     data-category-names="{{ category_names_json|default:'[]' }}"
     data-ac-avail-cats="{{ ac_avail_cats_json|default:'[]' }}"
     data-ac-avail-pl="{{ ac_avail_pl_json|default:'[]' }}"
     data-query-columns="{{ query_columns_json|default:'[]' }}">
</div>
{% endif %}
