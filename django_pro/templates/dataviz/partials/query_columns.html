{# Shown in #query-columns-result after selecting a saved query or running SQL #}
{% if error %}
<p class="text-xs text-red-500 mt-1">{{ error }}</p>
{% elif columns %}
<div class="mt-2 space-y-1">
  <p class="text-xs font-medium text-slate-500">
    {% if row_count is not None %}{{ row_count }} rows · {% endif %}{{ columns|length }} columns available
  </p>
  <div class="flex flex-wrap gap-1">
    {% for col in columns %}
    <span class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded px-2 py-0.5 cursor-pointer
                 hover:bg-blue-100 transition"
          title="{{ col }} — click to copy"
          onclick="navigator.clipboard.writeText('{{ col }}')">
      {{ col }}
    </span>
    {% endfor %}
  </div>
</div>
{% endif %}
