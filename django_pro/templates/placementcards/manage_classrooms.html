{% extends 'base.html' %}

{% block title %}Manage Classrooms{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8 space-y-6">
    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Manage Next Year Classrooms</h1>
            <p class="text-sm text-slate-500 mt-1">Set up classrooms for {{ school_year|default:"next year" }} student placement.</p>
        </div>
        <button hx-get="{% url 'placementcards:create_classroom' %}" hx-target="#classroom-form-shell" hx-swap="innerHTML" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
            Add New Classroom
        </button>
    </div>

    <div class="bg-white shadow rounded-lg border border-slate-200 overflow-hidden">
        <div class="p-4 bg-slate-50 border-b border-slate-200">
            <form method="get" class="flex items-center gap-4">
                <label class="text-sm font-medium text-slate-700">Filter Year:</label>
                <select name="school_year" onchange="this.form.submit()" class="rounded-md border-slate-300 py-1 pl-3 pr-8 text-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="{{ school_year }}">{{ school_year }}</option>
                    {% comment %} Options populated dynamically or just current selection {% endcomment %}
                </select>
            </form>
        </div>
        <div id="classroom-list" class="divide-y divide-slate-200">
            {% include 'placementcards/partials/classroom_list.html' %}
        </div>
    </div>
    
    <div id="classroom-form-shell"></div>
</div>
{% endblock %}
