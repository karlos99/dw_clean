{% extends 'base.html' %}

{% block title %}Placement Tags{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-6 space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold">Manage Placement Tags</h1>
        <button hx-get="{% url 'placementcards:create_tag' %}" hx-target="#tag-form-shell" hx-swap="innerHTML" class="px-4 py-2 text-sm bg-slate-900 text-white">Add Tag</button>
    </div>
    <div id="tags-table">{% include 'placementcards/partials/tags_table.html' %}</div>
    <div id="tag-form-shell"></div>
</div>
{% endblock %}
