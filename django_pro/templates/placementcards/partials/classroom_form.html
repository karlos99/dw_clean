<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white border border-slate-300 p-6 rounded-lg shadow-xl w-full max-w-md space-y-6 relative">
        <button type="button" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600" onclick="this.closest('.fixed').remove()">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        
        <div>
            <h2 class="font-bold text-xl text-slate-900">{% if mode == 'edit' %}Edit Classroom{% else %}Create Classroom{% endif %}</h2>
            <p class="text-sm text-slate-500 mt-1">Set up a next year classroom for student placement.</p>
        </div>

        <form hx-post="{% if mode == 'edit' %}{% url 'placementcards:edit_classroom' classroom.id %}{% else %}{% url 'placementcards:create_classroom' %}{% endif %}" hx-target="#classroom-list" hx-swap="innerHTML" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">School Year</label>
                <input type="text" name="school_year" value="{{ classroom.school_year|default:school_year|default:'' }}" placeholder="e.g. 2025-2026" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" required>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Grade Level(s)</label>
                    <div class="grid grid-cols-2 gap-1">
                        {% with sg=selected_grades %}
                        {% for grade_val, grade_label in grades_list %}
                        <label class="flex items-center gap-1.5 text-sm text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" name="grades" value="{{ grade_val }}"
                                {% if grade_val in sg %}checked{% endif %}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            {{ grade_label }}
                        </label>
                        {% endfor %}
                        {% endwith %}
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Capacity</label>
                    <input type="number" name="max_capacity" value="{{ classroom.max_capacity|default:24 }}" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Classroom Name / Room #</label>
                <input type="text" name="classroom_name" value="{{ classroom.classroom_name }}" placeholder="e.g. Room 101 or Mrs. Smith" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Assigned Teacher <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
                <input type="text" name="assigned_teacher_name" value="{{ classroom.assigned_teacher_name }}" placeholder="Leave blank if unknown" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <button type="button" class="px-4 py-2 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" onclick="this.closest('.fixed').remove()">Cancel</button>
                <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">{% if mode == 'edit' %}Save Changes{% else %}Create Classroom{% endif %}</button>
            </div>
        </form>
    </div>
</div>
