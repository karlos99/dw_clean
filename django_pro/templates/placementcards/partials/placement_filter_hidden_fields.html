<input type="hidden" name="student_year" value="{{ student_year }}">
<input type="hidden" name="placement_year" value="{{ placement_year }}">
<input type="hidden" name="grade" value="{{ grade_filter }}">
<input type="hidden" name="gender" value="{{ gender_filter }}">
<input type="hidden" name="race" value="{{ race_filter }}">
<input type="hidden" name="ell" value="{{ ell_filter }}">
<input type="hidden" name="sped" value="{{ sped_filter }}">
<input type="hidden" name="sed" value="{{ sed_filter }}">
<input type="hidden" name="foster" value="{{ foster_filter }}">
<input type="hidden" name="homeless" value="{{ homeless_filter }}">
<input type="hidden" name="gate" value="{{ gate_filter }}">
<input type="hidden" name="in_504" value="{{ in_504_filter }}">
<input type="hidden" name="dli" value="{{ dli_filter }}">
<input type="hidden" name="ltel" value="{{ ltel_filter }}">
<input type="hidden" name="status" value="{{ status_filter }}">
<input type="hidden" name="search" value="{{ search }}">
<input type="hidden" name="homeroom_teacher" value="{{ homeroom_teacher_filter }}">
{% for tag_id in selected_tag_ids %}
<input type="hidden" name="tag_ids" value="{{ tag_id }}">
{% endfor %}
{% for assessment_key in selected_assessment_keys %}
<input type="hidden" name="assessment_keys" value="{{ assessment_key }}">
{% endfor %}
{% for note_filter in selected_teacher_note_filters_flat %}
<input type="hidden" name="note_filter_{{ note_filter.question_id }}" value="{{ note_filter.value }}">
{% endfor %}
{% for enabled_filter in enabled_filters %}
<input type="hidden" name="enabled_filters" value="{{ enabled_filter }}">
{% endfor %}
{% for metric in selected_metrics %}
<input type="hidden" name="metrics" value="{{ metric }}">
{% endfor %}
