<div id="question-form-shell">
    <form hx-post="{% url 'placementcards:save_question' %}" hx-target="#questions-panel" hx-swap="outerHTML" class="bg-white border border-slate-200 p-4 grid md:grid-cols-2 gap-3">
        {% csrf_token %}
        <input type="hidden" name="question_id" value="{{ question.id|default:'' }}">
        <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Question Text</label>
            <input type="text" name="question_text" value="{{ question.question_text }}" class="w-full border border-slate-300 px-3 py-2 text-sm" required>
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Category</label>
            <select name="question_category" class="w-full border border-slate-300 px-3 py-2 text-sm" required>
                <option value="academic" {% if question.question_category == 'academic' %}selected{% endif %}>Academic</option>
                <option value="behavior" {% if question.question_category == 'behavior' %}selected{% endif %}>Behavior</option>
                <option value="physical" {% if question.question_category == 'physical' %}selected{% endif %}>Physical</option>
                <option value="attendance" {% if question.question_category == 'attendance' %}selected{% endif %}>Attendance</option>
                <option value="parent" {% if question.question_category == 'parent' %}selected{% endif %}>Parent</option>
                <option value="additional" {% if question.question_category == 'additional' %}selected{% endif %}>Additional</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Type</label>
            <select name="question_type" class="w-full border border-slate-300 px-3 py-2 text-sm" required>
                <option value="text" {% if question.question_type == 'text' %}selected{% endif %}>Text</option>
                <option value="textarea" {% if question.question_type == 'textarea' %}selected{% endif %}>Textarea</option>
                <option value="checkbox" {% if question.question_type == 'checkbox' %}selected{% endif %}>Checkbox</option>
                <option value="choice" {% if question.question_type == 'choice' %}selected{% endif %}>Choice</option>
                <option value="multiselect" {% if question.question_type == 'multiselect' %}selected{% endif %}>Multi Select</option>
                <option value="student_list" {% if question.question_type == 'student_list' %}selected{% endif %}>Student List</option>
            </select>
        </div>
        <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Options (comma-separated)</label>
            <input type="text" name="options" value="{{ options_value }}" class="w-full border border-slate-300 px-3 py-2 text-sm">
        </div>
        <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" name="requires_detail" {% if question.requires_detail %}checked{% endif %}> Requires detail field</label>
        <div class="flex justify-end gap-2">
            {% if mode == 'edit' %}
            <button type="button" hx-get="{% url 'placementcards:question_form' %}" hx-target="#question-form-shell" hx-swap="outerHTML" class="px-4 py-2 text-sm border border-slate-300 text-slate-700 bg-white">Cancel</button>
            {% endif %}
            <button type="submit" class="px-4 py-2 text-sm bg-slate-900 text-white">{% if mode == 'edit' %}Save Changes{% else %}Add Question{% endif %}</button>
        </div>
    </form>
</div>
