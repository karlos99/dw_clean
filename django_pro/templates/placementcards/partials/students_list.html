<div class="bg-white border border-slate-200 p-3 space-y-3">
    <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Unassigned Students ({{ students|length }})</h2>
        <span class="text-xs text-slate-500">Assigned students move to classroom lists automatically</span>
    </div>

    <form id="placement-assign-form" hx-post="{% url 'placementcards:assign_student' %}" hx-target="#placement-workspace" hx-swap="innerHTML" class="border border-slate-200 p-3 bg-slate-50 space-y-3">
        {% csrf_token %}
        {% include 'placementcards/partials/placement_filter_hidden_fields.html' %}
        <div class="flex flex-wrap items-end gap-3">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mass Assign To</label>
                <select name="classroom_id" class="border border-slate-300 px-2 py-2 text-sm min-w-56" required>
                    <option value="">Select classroom</option>
                    {% for classroom in classrooms %}
                    <option value="{{ classroom.id }}">{{ classroom.classroom_name }} ({{ classroom.grade }})</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white">Assign Selected</button>
        </div>

        <div class="space-y-2">
            {% for student in students %}
            <label draggable="true" data-draggable-student="{{ student.ssid }}" class="block border border-slate-200 p-2 bg-white hover:bg-slate-50 cursor-pointer">
                <div class="flex items-start gap-3">
                    <input type="checkbox" name="student_ssids" value="{{ student.ssid }}" class="mt-1">
                    <div class="flex-1">
                        <div class="flex items-center justify-between gap-2">
                            <div class="font-medium text-sm">{{ student.student_name }}</div>
                            {% if student.placement_card and student.placement_card.is_complete %}
                            <span class="text-xs text-green-700">Card Complete</span>
                            {% else %}
                            <span class="text-xs text-amber-700">Card Pending</span>
                            {% endif %}
                        </div>
                        <div class="text-xs text-slate-500">{{ student.ssid }} · Grade {{ student.grade }}{% if student.gender %} · {{ student.gender }}{% endif %}{% if student.race %} · {{ student.race }}{% endif %}</div>
                        <div class="text-xs text-slate-600">Current HR Teacher: {{ student.current_hr_teacher|default:'—' }}</div>
                        <div class="flex flex-wrap gap-1 mt-1">
                            {% if student.placement_card %}
                                {% for tag in student.placement_card.tags.all %}
                                    {% include 'placementcards/partials/tag_badge.html' with tag=tag %}
                                {% endfor %}
                            {% endif %}
                        </div>
                        <div class="mt-2">
                            <button type="button" hx-get="{% url 'placementcards:preview_card' student.ssid %}?student_year={{ student_year }}" hx-target="#placement-modal-shell" hx-swap="innerHTML" class="px-2 py-1 text-xs border border-slate-300 bg-white text-slate-700">View Card (Read Only)</button>
                        </div>
                    </div>
                </div>
            </label>
            {% empty %}
            <div class="text-sm text-slate-500">No unassigned students match the selected filters.</div>
            {% endfor %}
        </div>
    </form>
</div>
