{% load placementcards_tags %}

<div class="bg-white border border-slate-200 overflow-x-auto">
    <table class="min-w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th class="text-left px-3 py-2">Tag</th>
                <th class="text-left px-3 py-2">Description</th>
                <th class="text-left px-3 py-2">Usage</th>
                <th class="text-left px-3 py-2">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in tag_usage %}
            <tr class="border-b border-slate-100">
                <td class="px-3 py-2"><span class="inline-flex items-center gap-1 px-2 py-1 text-xs {{ item.color|tag_text_class }} {{ item.color|tag_color_class }}" style="{{ item.color|tag_color_style }}">{{ item.name }}</span></td>
                <td class="px-3 py-2">{% for tag in tags %}{% if tag.id == item.id %}{{ tag.description }}{% endif %}{% endfor %}</td>
                <td class="px-3 py-2">{{ item.usage_count }}</td>
                <td class="px-3 py-2 space-x-2">
                    <button hx-get="{% url 'placementcards:edit_tag' item.id %}" hx-target="#tag-form-shell" hx-swap="innerHTML" class="text-blue-600">Edit</button>
                    <form class="inline" hx-post="{% url 'placementcards:delete_tag' item.id %}" hx-target="#tags-table" hx-swap="innerHTML" onsubmit="return confirm('Delete this tag?')">
                        {% csrf_token %}
                        <button type="submit" class="text-red-600">Delete</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="px-3 py-4 text-slate-500">No tags defined.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
