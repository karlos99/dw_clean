
services:
  # PostgreSQL Database
  postgres:
    image: postgres:17.0-alpine
    container_name: dw_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsdata_user} -d ${POSTGRES_DB:-dsdata_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  # ClickHouse Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: dw_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fastapi_clickhouse_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh:ro
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-clickhouse_user}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dw_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dw_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./django_pro:/app/django_pro
      - ./django_pro/files/staticfiles:/app/django_pro/files/staticfiles
      - ./django_pro/files/mediafiles:/app/django_pro/files/mediafiles
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - dwdev_network
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
        cd /app/django_pro &&
        python manage.py migrate &&
        python create_superuser.py &&
        gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --reload --access-logfile - --error-logfile - config.wsgi:application
      "

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  
networks:
  dwdev_network:
    driver: bridge
