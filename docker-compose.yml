
services:
  # PostgreSQL Database

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dw_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dw_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CLICKHOUSE_HOST=10.130.3.106
      - CLICKHOUSE_DB=fastapi_clickhouse_db
      - CLICKHOUSE_USER=clickhouse_user
      - CLICKHOUSE_PASSWORD=a@B-UC:!=0hkRq6GX4^0
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_NATIVE_PORT=9000
      - USE_CLICKHOUSE_ANALYTICS=True
    volumes:
      - ./django_pro:/app/django_pro
      - ./django_pro/files/staticfiles:/app/django_pro/files/staticfiles
      - ./django_pro/files/mediafiles:/app/django_pro/files/mediafiles
      - ./logs:/app/logs
      - ./pictures:/app/pictures:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8000)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        cd /app/django_pro &&
        python manage.py migrate &&
        python create_superuser.py &&
        gunicorn --bind 0.0.0.0:8000 --workers 10 --threads 5 --timeout 120 --max-requests 1000 --max-requests-jitter 50 --access-logfile - --error-logfile - --log-level info config.wsgi:application
      "

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: dw_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./django_pro/files/staticfiles:/app/django_pro/files/staticfiles:ro
      - ./django_pro/files/mediafiles:/app/django_pro/files/mediafiles:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - django
    networks:
      - dwdev_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  
networks:
  dwdev_network:
    driver: bridge
